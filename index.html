<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Clima en mi Municipio</title>
    <style>
        :root {
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
            --accent: #3182ce;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .weather-card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            padding: 24px;
            max-width: 350px;
            width: 100%;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .weather-card:hover {
            transform: translateY(-5px);
        }

        .location {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .region {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .temp-container {
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--accent);
            margin: 10px 0;
        }

        .temp-unit {
            font-size: 1.5rem;
            vertical-align: super;
        }

        .description {
            font-size: 1.1rem;
            text-transform: capitalize;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .details {
            display: flex;
            justify-content: space-around;
            border-top: 1px solid #e2e8f0;
            padding-top: 15px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .error-msg {
            color: #e53e3e;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .loading {
            color: var(--text-muted);
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="weather-card">
        <div id="weather-content">
            <p class="loading">Solicitando acceso a tu ubicación...</p>
        </div>
    </div>

    <script>
        // Diccionario básico para traducir códigos de clima de Open-Meteo (WMO)
        const weatherCodes = {
            0: "Cielo despejado",
            1: "Principalmente despejado", 2: "Parcialmente nublado", 3: "Nublado",
            45: "Niebla", 48: "Niebla con escarcha",
            51: "Llovizna ligera", 53: "Llovizna moderada", 55: "Llovizna densa",
            61: "Lluvia débil", 63: "Lluvia moderada", 65: "Lluvia fuerte",
            71: "Nieve ligera", 73: "Nieve moderada", 75: "Nieve fuerte",
            77: "Granizo",
            80: "Lluvia ligera intermitente", 81: "Lluvia moderada intermitente", 82: "Lluvia fuerte intermitente",
            95: "Tormenta eléctrica", 96: "Tormenta con granizo ligero", 99: "Tormenta con granizo fuerte"
        };

        const contentDiv = document.getElementById('weather-content');

        // 1. Obtener coordenadas geográficas automáticamente
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(obtenerDatosClima, manejarErrorUbicacion);
        } else {
            contentDiv.innerHTML = '<p class="error-msg">Tu navegador no soporta la geolocalización.</p>';
        }

        async function obtenerDatosClima(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;

            try {
                contentDiv.innerHTML = '<p class="loading">Cargando datos del clima...</p>';

                // 2. Obtener Nombre del Municipio y Estado (Cambió a concatenación tradicional para evitar URL rota)
                const geoUrl = 'https://openstreetmap.org' + lat + '&lon=' + lon + '&accept-language=es';
                
                const geoRes = await fetch(geoUrl, {
                    headers: { 'Accept-Language': 'es' }
                });
                const geoData = await geoRes.json();

                // Extraer municipio/localidad y estado de la estructura de OpenStreetMap
                const direccion = geoData.address;
                const municipio = direccion.town || direccion.county || direccion.city || direccion.village || "Tu Municipio";
                const estado = direccion.state || "Tu Estado";

                // 3. Obtener el clima desde la API de Open-Meteo
                const weatherUrl = 'https://open-meteo.com' + lat + '&longitude=' + lon + '&current_weather=true';
                const weatherRes = await fetch(weatherUrl);
                const weatherData = await weatherRes.json();

                const climaActual = weatherData.current_weather;
                const temperatura = Math.round(climaActual.temperature);
                const descripcion = weatherCodes[climaActual.weathercode] || "Condiciones variables";
                const viento = climaActual.windspeed;

                // 4. Renderizar los datos limpios en la tarjeta
                contentDiv.innerHTML = `
                    <div class="location">${municipio}</div>
                    <div class="region">${estado}</div>
                    <div class="temp-container">${temperatura}<span class="temp-unit">°C</span></div>
                    <div class="description">${descripcion}</div>
                    <div class="details">
                        <div>💨 Viento: <strong>${viento} km/h</strong></div>
                    </div>
                `;

            } catch (error) {
                console.error("Detalle del error:", error);
                contentDiv.innerHTML = '<p class="error-msg">Error al conectar con los servicios de clima.</p>';
            }
        }

        function manejarErrorUbicacion(error) {
            let mensaje = "No se pudo obtener tu ubicación.";
            if (error.code === error.PERMISSION_DENIED) {
                mensaje = "Por favor, permite el acceso a tu ubicación para poder mostrar el clima de tu municipio.";
            }
            contentDiv.innerHTML = '<p class="error-msg">' + mensaje + '</p>';
        }
    </script>
</body>
</html>
