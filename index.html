<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clima en Tiempo Real</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #2d3436;
        }
        .weather-card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 320px;
            width: 100%;
        }
        h2 { margin: 0 0 10px 0; font-size: 1.6rem; color: #2d3436; }
        .city { font-size: 1.1rem; color: #636e72; margin-bottom: 20px; }
        .temp { font-size: 3rem; font-weight: bold; color: #0984e3; margin: 10px 0; }
        .desc { text-transform: capitalize; font-weight: 600; color: #2d3436; }
        .error-msg { color: #d63031; font-weight: bold; }
    </style>
</head>
<body>

    <div class="weather-card">
        <h2>Condiciones Climatológicas</h2>
        <div id="weather-content">
            <p>Obteniendo coordenadas y clima...</p>
        </div>
    </div>

    <script>
        // Variables globales de configuración
        const lat = 16.75; 
        const lon = -93.37523238236625;
        const apiKey = '6a88db408312446d38614b7874884c84';

        // LÍNEA 53: Función corregida con el endpoint oficial de OpenWeather y la sintaxis de parámetros correcta (?lat=)
        async function getWeatherData(lat, lon) {
            const url = `https://openweathermap.org{lat}&lon=${lon}&appid=${apiKey}&units=metric&lang=es`;

            try {
                const response = await fetch(url);
                
                // Validación para detectar problemas como API keys inactivas (Error 401)
                if (!response.ok) {
                    throw new Error(`Servidor respondió con código ${response.status}`);
                }

                const data = await response.json();
                
                // Pintamos los resultados en el HTML si todo salió bien
                displayWeather(data);

            } catch (error) {
                // LÍNEA 67: Manejo seguro de errores para evitar cierres inesperados de la app
                console.error("Error capturado:", error.message);
                document.getElementById('weather-content').innerHTML = `
                    <p class="error-msg">Error al conectar con el clima.</p>
                    <small style="color: #74b9ff">${error.message}</small>
                `;
            }
        }

        // Función encargada de estructurar e insertar los datos en el contenedor del HTML
        function displayWeather(data) {
            const container = document.getElementById('weather-content');
            
            const cityName = data.name || "Ubicación Consultada";
            const temp = Math.round(data.main.temp);
            const description = data.weather[0].description; // Acceso correcto al arreglo de clima
            const icon = data.weather[0].icon;

            container.innerHTML = `
                <div class="city">${cityName}</div>
                <img src="https://openweathermap.org{icon}@2x.png" alt="${description}" width="100">
                <div class="temp">${temp}°C</div>
                <p class="desc">${description}</p>
            `;
        }

        // LÍNEA 93: Inicialización automática de la consulta de datos al cargar el archivo
        getWeatherData(lat, lon);
    </script>
</body>
</html>
