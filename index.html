<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Clima</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .weather-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 350px;
            width: 100%;
        }
        h2 { margin-top: 0; color: #333; }
        .temp { font-size: 2.5rem; font-weight: bold; color: #007bff; margin: 10px 0; }
        .desc { text-transform: capitalize; color: #666; }
        .error-msg { color: #dc3545; font-weight: bold; }
    </style>
</head>
<body>

    <div class="weather-card">
        <h2>Clima Actual</h2>
        <div id="weather-content">
            <p>Cargando datos del clima...</p>
        </div>
    </div>

    <script>
        // Coordenadas basadas en tu consulta previa (Ocozocoautla, Chiapas aproximadamente)
        const lat = 16.75; 
        const lon = -93.37523238236625;
        const apiKey = '6a88db408312446d38614b7874884c84';

        // Función para obtener los datos desde OpenWeather
        async function getWeatherData(lat, lon) {
            // URL corregida con el subdominio 'api.' y los parámetros estructurados (?lat=)
            const url = `https://openweathermap.org{lat}&lon=${lon}&appid=${apiKey}&units=metric&lang=es`;

            try {
                const response = await fetch(url);
                
                // Si la respuesta no es exitosa (ej. API key inválida o error 404)
                if (!response.ok) {
                    throw new Error(`Código de error: ${response.status}`);
                }

                const data = await response.json();
                
                // Llamamos a la función para pintar los datos en pantalla
                displayWeather(data);

            } catch (error) {
                // Manejo de errores de red o caídas del servidor
                console.error("Error capturado:", error.message);
                document.getElementById('weather-content').innerHTML = `
                    <p class="error-msg">No se pudo obtener el clima.</p>
                    <small>${error.message}</small>
                `;
            }
        }

        // Función para renderizar la información en el contenedor HTML
        function displayWeather(data) {
            const container = document.getElementById('weather-content');
            
            const cityName = data.name || "Tu Ubicación";
            const temp = Math.round(data.main.temp);
            const description = data.weather[0].description;
            const icon = data.weather[0].icon;

            container.innerHTML = `
                <h3>${cityName}</h3>
                <img src="https://openweathermap.org{icon}@2x.png" alt="${description}">
                <div class="temp">${temp}°C</div>
                <p class="desc">${description}</p>
            `;
        }

        // Ejecución automática al cargar la página
        getWeatherData(lat, lon);
    </script>
</body>
</html>
